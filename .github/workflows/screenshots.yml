name: Simulator screenshots

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Generate project
        run: brew install xcodegen && xcodegen generate

      - name: Pick an iOS 26 iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          c = [x for k, v in d.items() if 'iOS-26' in k for x in v if x['name'].startswith('iPhone')]
          pro = [x for x in c if x['name'].endswith('Pro')]
          pick = (pro or c)[-1]
          print(pick['udid']); print(pick['name'], file=sys.stderr)
          ")
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project Pure.xcodeproj -scheme Pure -configuration Debug \
            -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | grep -E "error:|BUILD" || true
          test -d build/Build/Products/Debug-iphonesimulator/Pure.app

      - name: Capture screenshots
        run: |
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Pure.app
          mkdir shots
          xcrun simctl launch "$UDID" com.alicelikeeat.pure
          sleep 8
          xcrun simctl io "$UDID" screenshot shots/00-list.png
          for i in 0 1 2 4 5 6 7 10 13 14 17 18 20 23; do
            xcrun simctl terminate "$UDID" com.alicelikeeat.pure || true
            xcrun simctl launch "$UDID" com.alicelikeeat.pure -startChapter $i
            sleep 7
            xcrun simctl io "$UDID" screenshot "shots/ch-$(printf %02d $i).png"
          done
          for i in 0 5 13; do
            xcrun simctl terminate "$UDID" com.alicelikeeat.pure || true
            xcrun simctl launch "$UDID" com.alicelikeeat.pure -startChapter $i -backdropStyle aurora
            sleep 7
            xcrun simctl io "$UDID" screenshot "shots/aurora-ch-$(printf %02d $i).png"
          done
          xcrun simctl terminate "$UDID" com.alicelikeeat.pure || true
          xcrun simctl launch "$UDID" com.alicelikeeat.pure -backdropStyle aurora
          sleep 7
          xcrun simctl io "$UDID" screenshot shots/aurora-list.png
          mkdir -p shots/crash
          cp ~/Library/Logs/DiagnosticReports/Pure* shots/crash/ 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 15m --predicate 'process == "Pure"' --style compact 2>/dev/null | grep -iE "fatal|crash|error|precondition" | tail -40 > shots/crash/log.txt || true

      - name: Publish screenshots to the screenshots branch
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screenshots

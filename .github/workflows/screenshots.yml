name: Simulator screenshots

on:
  workflow_dispatch:
    inputs:
      only:
        description: "只截某一组（formula），留空截全部"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  shots:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Generate project
        run: brew install xcodegen && mkdir -p Bundled && touch Bundled/.keep && xcodegen generate

      - name: Pick an iOS 26 iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          c = [x for k, v in d.items() if 'iOS-26' in k for x in v if x['name'].startswith('iPhone')]
          pro = [x for x in c if x['name'].endswith('Pro')]
          pick = (pro or c)[-1]
          print(pick['udid']); print(pick['name'], file=sys.stderr)
          ")
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project Pure.xcodeproj -scheme Pure -configuration Debug \
            -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | grep -E "error:|BUILD" || true
          mkdir -p Bundled; test -f build/Build/Products/Debug-iphonesimulator/Pure.app/Pure

      - name: Capture screenshots
        run: |
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Pure.app
          mkdir shots
          xcrun simctl launch "$UDID" com.alicelikeeat.purephilosophy
          sleep 8
          xcrun simctl io "$UDID" screenshot shots/00-list.png
          run_shot() { name=$1; shift
            xcrun simctl terminate "$UDID" com.alicelikeeat.purephilosophy || true
            xcrun simctl launch "$UDID" com.alicelikeeat.purephilosophy "$@"
            sleep 7
            xcrun simctl io "$UDID" screenshot "shots/$name.png"; }
          if [ "${{ inputs.only }}" = "formula" ]; then
            xcrun simctl terminate "$UDID" com.alicelikeeat.purephilosophy || true
            xcrun simctl launch "$UDID" com.alicelikeeat.purephilosophy -formulaDemo -appearance light
            for s in 3 6 10 16 30 40; do sleep 2; xcrun simctl io "$UDID" screenshot "shots/formula-$s.png"; done
            exit_early=1
          fi
          if [ "${{ inputs.only }}" = "editions" ]; then
            for b in kant-cpr lunyu discourse tractatus; do run_shot "ed-$b" -openBook $b -appearance light; sleep 6; xcrun simctl io "$UDID" screenshot "shots/ed-$b-late.png"; done
            exit_early=1
          fi
          if [ -z "$exit_early" ]; then
          for page in 0 1 2 3 4 5 6 7 8; do for b in 1 2; do
            run_shot "ddj-p$page-b$b" -animGrid daodejing-zh -animPage $page -animBeat $b -appearance light
          done; done
          for page in 0 3 6 12 20 30; do
            run_shot "lunyu-p$page" -animGrid lunyu-zh -animPage $page -animBeat 1 -appearance light
          done
          run_shot "tlp-p10" -animGrid tractatus-de -animPage 10 -animBeat 1 -appearance light
          run_shot reader-ddj -openReader daodejing -readerQuery 上善若水 -autoDownload -readerLang original -appearance light
          run_shot home-light -appearance light
          fi
          mkdir -p shots/crash
          cp ~/Library/Logs/DiagnosticReports/Pure* shots/crash/ 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 15m --predicate 'process == "Pure"' --style compact 2>/dev/null | grep -iE "fatal|crash|error|precondition" | tail -40 > shots/crash/log.txt || true

      - name: Publish screenshots to the screenshots branch
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screenshots

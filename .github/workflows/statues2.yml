name: Statue prototypes (museum APIs)
on: workflow_dispatch
permissions: { contents: write }
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/statues/find3.py
      - run: |
          git config user.name "statue-bot"; git config user.email "bot@users.noreply.github.com"
          cp europeana.json /tmp/ && git checkout --orphan statues-data3 && git rm -rfq . && cp /tmp/europeana.json . && git add europeana.json && git commit -qm "europeana" && git push -f origin statues-data3

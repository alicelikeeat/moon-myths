name: Unpublish releases

# 手动运行：删除指定版本的 Release 和对应标签
on:
  workflow_dispatch:
    inputs:
      versions:
        description: "要下架的版本，空格分隔"
        required: true
        default: "v1.26 v1.27 v1.28 v1.29 v1.30 v1.31 v1.32 v1.33 v1.34 v1.35"

permissions:
  contents: write

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for v in ${{ inputs.versions }}; do
            gh release delete "$v" --repo "${{ github.repository }}" --cleanup-tag --yes && echo "deleted $v" || echo "skip $v"
          done

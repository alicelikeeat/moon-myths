name: Build Pure unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Pure.xcodeproj \
            -scheme Pure \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: unre|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Pure.app

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Pure.app Payload/
          zip -qry Pure-v1.0-unsigned.ipa Payload
          ls -lh Pure-v1.0-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Pure-v1.0-unsigned
          path: Pure-v1.0-unsigned.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build-${{ github.run_number }}
          name: Pure v1.0 (build ${{ github.run_number }})
          body: 未签名 IPA，用 TrollStore / AltStore / Sideloadly 等自行签名安装。
          files: Pure-v1.0-unsigned.ipa

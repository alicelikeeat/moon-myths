name: Build Pure unsigned IPA

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "project.yml"
      - "VERSION"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:
    inputs:
      offline:
        description: "离线版：把全部全文和动画打包进 App（不用下载）"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Compute version (auto +0.1 per release)
        run: |
          LAST=$(git ls-remote --tags origin 'refs/tags/v*' | sed 's#.*refs/tags/##' \
                 | grep -E '^v[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          BASE=$(tr -d '[:space:]' < VERSION)
          if [ -z "$LAST" ]; then
            VER="$BASE"
          else
            MAJ=${LAST#v}; MAJ=${MAJ%%.*}
            MIN=${LAST##*.}
            VER="$MAJ.$((MIN + 1))"
            # VERSION 文件可手动调高（例如升到 2.0）
            if [ "$(printf '%s\n%s\n' "$VER" "$BASE" | sort -V | tail -1)" = "$BASE" ] && [ "$BASE" != "$VER" ]; then VER="$BASE"; fi
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "Releasing v$VER (build ${{ github.run_number }})"

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Bundle texts for the offline edition
        if: ${{ inputs.offline }}
        run: |
          mkdir -p Bundled
          cp -R texts anims Bundled/
          du -sh Bundled
          echo "SUFFIX=-offline" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: |
          mkdir -p Bundled && touch Bundled/.keep   # 普通版：空文件夹
          xcodegen generate

      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Pure.xcodeproj \
            -scheme Pure \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VER" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build | tee xcodebuild.log | grep -E "error:|warning: unre|BUILD" || true
          ! grep -q "BUILD FAILED" xcodebuild.log
          test -f build/Build/Products/Release-iphoneos/Pure.app/Pure

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Pure.app Payload/
          zip -qry Pure-v${{ env.VER }}${{ env.SUFFIX }}-unsigned.ipa Payload
          ls -lh Pure-v${{ env.VER }}${{ env.SUFFIX }}-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Pure-v${{ env.VER }}${{ env.SUFFIX }}-unsigned
          path: Pure-v${{ env.VER }}${{ env.SUFFIX }}-unsigned.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Pure v${{ env.VER }}${{ inputs.offline && '（离线版）' || '' }}
          body: ${{ inputs.offline && '离线版：全部全文与动画已打包进 App，不用下载。未签名 IPA，用 TrollStore / AltStore / Sideloadly 等自行签名安装。' || '未签名 IPA，用 TrollStore / AltStore / Sideloadly 等自行签名安装。' }}
          files: Pure-v${{ env.VER }}${{ env.SUFFIX }}-unsigned.ipa

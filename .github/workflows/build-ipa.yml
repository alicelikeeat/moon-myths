name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project MoonMyths.xcodeproj \
            -scheme MoonMyths \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: unre|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/MoonMyths.app

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MoonMyths.app Payload/
          zip -qry MoonMyths-unsigned.ipa Payload
          ls -lh MoonMyths-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MoonMyths-unsigned
          path: MoonMyths-unsigned.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Moon Myths build ${{ github.run_number }}
          body: 未签名 IPA，用 TrollStore / AltStore / Sideloadly 等自行签名安装。
          files: MoonMyths-unsigned.ipa

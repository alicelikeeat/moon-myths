name: Find editions
on: workflow_dispatch
permissions: { contents: write }
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/editions/check.py geometricalsolut00arch methodofarchimed00arch worksofarchimede00arch 06076246.cn 02093859.cn lagomtrie00descuoft
      - run: |
          git config user.name "editions-bot"; git config user.email "bot@users.noreply.github.com"
          git checkout --orphan editions-data && git rm -rfq . && git add check.json && git commit -qm "candidates" && git push -f origin editions-data

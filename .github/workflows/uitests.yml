name: UI tests

on:
  workflow_dispatch:

jobs:
  uitests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: brew install xcodegen && mkdir -p Bundled && touch Bundled/.keep && xcodegen generate
      - name: Pick an iOS 26 iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          c = [x for k, v in d.items() if 'iOS-26' in k for x in v if x['name'].startswith('iPhone')]
          pro = [x for x in c if x['name'].endswith('Pro')]
          print((pro or c)[-1]['udid'])
          ")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild test -project Pure.xcodeproj -scheme Pure -sdk iphonesimulator \
            -destination "id=$UDID" -derivedDataPath build -resultBundlePath result.xcresult \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
            2>&1 | grep -E "error:|Test Case|ROUND|AFTER|failed|passed|BUILD|TEST" | tail -60
